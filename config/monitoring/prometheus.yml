global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: higress
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ['127.0.0.1:15000']
  - job_name: higress-agent
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ['127.0.0.1:15020']
