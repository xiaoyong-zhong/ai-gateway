name: api-gateway-benchmark

services:
  init:
    image: node:24-alpine
    command: ["node", "/bench/init.mjs"]
    volumes:
      - ./test/benchmark:/bench:ro
      - ./runtime/gateway-benchmark/higress:/data
      - ./runtime/gateway-benchmark/reports:/reports
    networks: [benchmark]

  mock:
    image: node:24-alpine
    command: ["node", "/bench/mock.mjs"]
    environment:
      MOCK_DELAY_MS: ${MOCK_DELAY_MS:-0}
      MOCK_RESPONSE_CHARS: ${MOCK_RESPONSE_CHARS:-512}
      MOCK_STREAM_CHUNKS: ${MOCK_STREAM_CHUNKS:-10}
      MOCK_STREAM_INTERVAL_MS: ${MOCK_STREAM_INTERVAL_MS:-50}
    volumes:
      - ./test/benchmark:/bench:ro
    ports: ["127.0.0.1:19000:9000"]
    networks:
      benchmark:
        ipv4_address: 172.30.51.4
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    command: ["--config", "/bench/litellm.yaml", "--port", "4000"]
    volumes:
      - ./test/benchmark:/bench:ro
    ports: ["127.0.0.1:14000:4000"]
    depends_on:
      mock:
        condition: service_healthy
    networks:
      benchmark:
        ipv4_address: 172.30.51.2
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.Request('http://localhost:4000/v1/models',headers={'Authorization':'Bearer sk-benchmark'}); assert any(m['id']=='benchmark-chat' for m in json.load(urllib.request.urlopen(r,timeout=3))['data'])"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 30s

  higress:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:latest
    volumes:
      - ./runtime/gateway-benchmark/higress:/data
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18001:8001"
    depends_on:
      init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    networks:
      benchmark:
        ipv4_address: 172.30.51.3
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-H", "Authorization: Bearer sk-benchmark", "http://localhost:8080/v1/models"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 30s

  k6:
    image: grafana/k6:1.3.0
    profiles: [tools]
    volumes:
      - ./test/benchmark:/bench:ro
      - ./runtime/gateway-benchmark/reports:/reports
    networks: [benchmark]

networks:
  benchmark:
    ipam:
      config:
        - subnet: 172.30.51.0/24
